name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oneorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oneorder/package-lock.json
      - run: npm ci
      - run: npm run check

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: '1'
      NODE_ENV: production
      # Optional Firebase config. Leave the secrets unset to build a fully offline app.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_STORE_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORE_ID }}
    defaults:
      run:
        working-directory: oneorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oneorder/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - run: npm ci

      - name: Generate the native Android project
        shell: bash
        run: npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log

      - name: Diagnose the node commands Gradle runs
        continue-on-error: true
        working-directory: oneorder/android
        shell: bash
        run: |
          set +e
          nl=$'\n'
          report=""
          probe() {
            out=$("$@" 2>&1 | head -c 400)
            code=${PIPESTATUS[0]}
            report="${report}[exit ${code}] ${1} ${2} ${3:0:90}${nl}${out:0:300}${nl}"
          }
          node -v; npm -v
          probe node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
          probe node --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
          probe node --print "require.resolve('react-native/package.json')"
          probe node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking react-native-config --platform android --json
          probe node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking resolve --platform android --json
          probe node -e "require('expo/scripts/resolveAppEntry')" "$(dirname "$PWD")" android absolute
          probe node --print "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"
          probe node --print "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"
          probe node --print "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"
          report="${report//%/%25}"
          report="${report//$nl/%0A}"
          echo "::warning title=node-diagnostics::${report}"

      - name: Give Gradle more memory
        # The generated file has no trailing newline, so start with one; otherwise this line is glued
        # onto the previous property and corrupts its value.
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - name: Install node call logger
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nodeshim"
          cat > "$RUNNER_TEMP/nodeshim/node" <<'SHIM'
          #!/usr/bin/env bash
          out=$(mktemp); err=$(mktemp)
          "$REAL_NODE" "$@" >"$out" 2>"$err"
          code=$?
          {
            echo "[exit $code] node $(printf '%s ' "$@" | cut -c1-260)"
            [ "$code" -ne 0 ] && head -c 1500 "$err"
          } >> "$NODE_CALL_LOG"
          cat "$out"
          cat "$err" >&2
          rm -f "$out" "$err"
          exit $code
          SHIM
          chmod +x "$RUNNER_TEMP/nodeshim/node"
          echo "REAL_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "NODE_CALL_LOG=$RUNNER_TEMP/node-calls.log" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: oneorder/android
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/nodeshim:$PATH"
          ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log

      - name: Show build errors in the run summary
        if: failure()
        shell: bash
        run: |
          set +e
          esc=$(printf '\033')
          nl=$'\n'
          for f in prebuild.log android/build.log; do
            if [ ! -f "$f" ]; then echo "::warning::$f does not exist"; continue; fi
            clean=$(sed "s/${esc}\[[0-9;]*m//g" "$f" | grep -vE '^[[:space:]]*$' | grep -vE '^[[:space:]]+- |^[[:space:]]+at (org|java|jdk|kotlin)' | cut -c1-220)
            total_lines=$(printf '%s\n' "$clean" | wc -l)
            echo "$f cleaned lines: $total_lines"
            # The real error is always near the end (Gradle prints "FAILURE:" last), so report the
            # tail, not the head - the head is just successful task names once the build gets far.
            clean=$(printf '%s\n' "$clean" | tail -n 420)
            i=0
            while [ $i -lt 6 ]; do
              chunk=$(printf '%s\n' "$clean" | sed -n "$((i * 70 + 1)),$((i * 70 + 70))p")
              [ -z "$chunk" ] && break
              chunk="${chunk//%/%25}"
              chunk="${chunk//$nl/%0A}"
              echo "::error title=$f part $((i + 1))::$chunk"
              i=$((i + 1))
            done
          done
          if [ -f "$NODE_CALL_LOG" ]; then
            total=$(grep -c '^\[exit' "$NODE_CALL_LOG")
            bad=$(grep -c '^\[exit [1-9]' "$NODE_CALL_LOG")
            msg=$(awk '/^\[exit [1-9]/{p=1} /^\[exit 0\]/{p=0} p' "$NODE_CALL_LOG" | head -60 | cut -c1-300)
            msg="${msg//%/%25}"
            msg="${msg//$nl/%0A}"
            echo "::error title=node-calls ${bad} of ${total} failed::${msg}"
          else
            echo "::warning::no node call log was written"
          fi
          exit 0

      - name: Name the APK
        id: apk
        run: |
          set -e
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NAME="ONEORDER-${SHORT}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${NAME}"
          # A second copy under a fixed name, so releases/latest/download/ONEORDER.apk always
          # resolves to the newest build without the download link changing every time.
          cp android/app/build/outputs/apk/release/app-release.apk ONEORDER.apk
          ls -lh "${NAME}" ONEORDER.apk
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ONEORDER-apk
          path: oneorder/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Publishes a real GitHub Release with the raw .apk attached (not a zip, no login needed
      # since the repo is public) on every push to the default branch, plus on version tags.
      - name: Publish release
        if: |
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          make_latest: true
          generate_release_notes: true
          files: |
            oneorder/${{ steps.apk.outputs.name }}
            oneorder/ONEORDER.apk
