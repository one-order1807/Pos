name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oneorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oneorder/package-lock.json
      - run: npm ci
      - run: npm run check

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: '1'
      NODE_ENV: production
      # Optional Firebase config. Leave the secrets unset to build a fully offline app.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_STORE_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORE_ID }}
    defaults:
      run:
        working-directory: oneorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: oneorder/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - run: npm ci

      - name: Generate the native Android project
        shell: bash
        run: npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log

      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build release APK
        working-directory: oneorder/android
        shell: bash
        run: ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log

      - name: Show build errors in the run summary
        if: failure()
        shell: bash
        run: |
          set +e
          for f in prebuild.log android/build.log; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f does not exist"
              continue
            fi
            wrong=$(awk '/What went wrong/{p=1} /\* Try:/{p=0} p' "$f" | head -12 | cut -c1-300)
            n=$(grep -n 'FAILED$' "$f" | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then
              start=$((n - 60)); [ "$start" -lt 1 ] && start=1
              before=$(sed -n "${start},$((n + 3))p" "$f" | cut -c1-300)
            else
              before=$(tail -n 40 "$f" | cut -c1-300)
            fi
            msg="${wrong}"$'\n'"--- lines before the failing task ---"$'\n'"${before}"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=$f::$msg"
          done
          exit 0

      - name: Name the APK
        id: apk
        run: |
          set -e
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NAME="ONEORDER-${SHORT}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${NAME}"
          ls -lh "${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ONEORDER-apk
          path: oneorder/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: oneorder/${{ steps.apk.outputs.name }}
          generate_release_notes: true
